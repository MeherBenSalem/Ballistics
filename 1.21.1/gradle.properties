org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# NeoForge 21.1.x targets Minecraft 1.21.1 (Java 21). Versions verified against the official
# NeoForge 1.21.1 ModDevGradle MDK template.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

# Parchment adds readable parameter names in the dev environment. It requires access to
# maven.parchmentmc.org, so it is opt-in. Set use_parchment=true to enable it.
use_parchment=false
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Unit test dependencies (Maven Central)
junit_version=5.11.4

## Mod properties
mod_id=remnants_ballistics
mod_name=Remnants: Ballistics
mod_license=Apache-2.0
mod_version=0.3.0
mod_group_id=com.nightbeam.remnants
mod_authors=NAIZO
mod_description=A tactical firearms expansion: first-person gunplay, voxel weapon models, attachments, ammunition, crafting and server-authoritative multiplayer.
