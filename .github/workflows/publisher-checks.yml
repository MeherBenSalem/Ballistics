name: Publisher checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.21.1/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.21.1/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          node --check scripts/release_metadata.mjs
          node --check scripts/upload_platforms.mjs
          node --check scripts/upload_platforms.test.mjs
      - name: Test metadata, offline preview and mocked upload transport
        run: node --test scripts/*.test.mjs

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check generated assets against the Java registries
        run: python tools/assets/check_assets.py
      - name: Reference docs are up to date
        run: |
          python tools/docs_gen.py
          git diff --exit-code -- docs/

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        game: ['1.21.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        id: build
        run: |
          set -o pipefail
          chmod +x "${{ matrix.game }}/gradlew"
          cd "${{ matrix.game }}"
          ./gradlew build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 scripts/ci_annotate.py build-output.log "Build errors (${{ matrix.game }})"
      - name: Run GameTests on a headless server
        id: gametest
        run: |
          set -o pipefail
          cd "${{ matrix.game }}"
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-output.log"
      - name: Report GameTest results
        if: always() && steps.build.outcome == 'success'
        run: |
          if [ ! -f gametest-output.log ]; then exit 0; fi
          grep -hoE '(All [0-9]+ required tests passed|[0-9]+ required tests failed)[^"]*' gametest-output.log \
            | head -1 | sed 's/^/::notice title=GameTests (${{ matrix.game }})::/' || true
          if [ "${{ steps.gametest.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-output.log "GameTest failures (${{ matrix.game }})"
          fi
      - uses: actions/setup-python@v5
        if: always() && steps.build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install a virtual display and software OpenGL
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install --quiet pillow
      - name: Boot the client and exercise every weapon
        id: smoketest
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.game }}/run/smoketest"
          cp scripts/smoketest-options.txt "${{ matrix.game }}/run/smoketest/options.txt"
          cd "${{ matrix.game }}"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientSmokeTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-output.log"
      - name: Report the client smoke test
        id: smokereport
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-output.log --run-dir "${{ matrix.game }}/run/smoketest" --out smoketest
      - name: Verify the packaged jar
        id: verify
        if: always() && steps.build.outcome == 'success'
        run: |
          VERSION=$(grep '^mod_version=' "${{ matrix.game }}/gradle.properties" | cut -d= -f2)
          mkdir -p releases
          cp "${{ matrix.game }}"/build/libs/remnants_ballistics-neoforge-*-"$VERSION".jar releases/
          python3 scripts/verify_release_jars.py --version "$VERSION" --jar-dir releases --output releases/manifest.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: verified-${{ matrix.game }}
          path: |
            releases/*.jar
            releases/manifest.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: client-smoke-test-${{ matrix.game }}
          if-no-files-found: ignore
          path: |
            smoketest/
            smoketest-output.log
            ${{ matrix.game }}/run/smoketest/logs/
            ${{ matrix.game }}/run/smoketest/crash-reports/
      - name: Publish the development build
        if: always() && steps.verify.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GAMETESTS: ${{ steps.gametest.outcome }}
          SMOKETEST: ${{ steps.smokereport.outcome }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          SUMMARY=$(cat smoketest/summary.txt 2>/dev/null || echo "did not run")
          gh release create dev-build releases/*.jar releases/manifest.json --prerelease --target "$GITHUB_SHA" \
            --title "Development build ${GITHUB_SHA::7}" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. Unit tests and jar verification passed; GameTests: ${GAMETESTS}; client smoke test: ${SMOKETEST} (${SUMMARY}). The smoke-*.jpg files are screenshots from that run. For testing only; use the tagged releases for servers."
          if ls smoketest/*.jpg > /dev/null 2>&1; then gh release upload dev-build smoketest/*.jpg --clobber; fi
