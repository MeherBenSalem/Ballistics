name: Publisher checks

on:
  push:
    branches: [main, multiloader]
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          node --check scripts/release_metadata.mjs
          node --check scripts/upload_platforms.mjs
          node --check scripts/upload_platforms.test.mjs
      - name: Test metadata, offline preview and mocked upload transport
        run: node --test scripts/*.test.mjs

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check generated assets against the Java registries
        run: python tools/assets/check_assets.py
      - name: Ported resources match the 1.21.1 originals
        run: |
          python tools/assets/port_resources.py
          git add -N .
          git diff --exit-code --stat -- 1.20.1/common/src/main/resources
      - name: Reference docs are up to date
        run: |
          python tools/docs_gen.py
          git diff --exit-code -- docs/

  # One job per Minecraft version and loader: build, unit tests, GameTests on a headless server, a scripted client
  # run under Xvfb (screenshots of every weapon), and an audit of the packaged jar.
  build:
    name: build (${{ matrix.game }} ${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: '1.20.1', loader: forge, gametest: runGameTestServer }
          - { game: '1.20.1', loader: fabric, gametest: runGametest }
          - { game: '1.21.1', loader: neoforge, gametest: runGameTestServer }
          - { game: '1.21.1', loader: fabric, gametest: runGametest }
    env:
      WS: ${{ matrix.game }}
      LOADER: ${{ matrix.loader }}
      TARGET: ${{ matrix.game }}-${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v4
      # Gradle runs on the last JDK listed; each workspace compiles with the toolchain its gradle.properties names.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        id: build
        run: |
          set -o pipefail
          chmod +x "$WS/gradlew"
          cd "$WS"
          ./gradlew :common:test ":$LOADER:build" --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 scripts/ci_annotate.py build-output.log "Build errors ($TARGET)"
      - name: Run GameTests on a headless server
        id: gametest
        run: |
          set -o pipefail
          cd "$WS"
          ./gradlew ":$LOADER:${{ matrix.gametest }}" --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-output.log"
      - name: Report GameTest results
        if: always() && steps.build.outcome == 'success'
        run: |
          if [ ! -f gametest-output.log ]; then exit 0; fi
          grep -hoE '(All [0-9]+ required tests passed|[0-9]+ required tests failed)[^"]*' gametest-output.log \
            | head -1 | sed "s/^/::notice title=GameTests ($TARGET)::/" || true
          if [ "${{ steps.gametest.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-output.log "GameTest failures ($TARGET)"
          fi
      - uses: actions/setup-python@v5
        if: always() && steps.build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install a virtual display and software OpenGL
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install --quiet pillow
      - name: Boot the client and exercise every weapon
        id: smoketest
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p "$WS/$LOADER/run/smoketest"
          cp scripts/smoketest-options.txt "$WS/$LOADER/run/smoketest/options.txt"
          cd "$WS"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew ":$LOADER:runClientSmokeTest" --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-output.log"
      - name: Report the client smoke test
        id: smokereport
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-output.log --run-dir "$WS/$LOADER/run/smoketest" --out smoketest --prefix "$TARGET"
      - name: Verify the packaged jar
        id: verify
        if: always() && steps.build.outcome == 'success'
        run: |
          VERSION=$(grep '^mod_version=' "$WS/gradle.properties" | cut -d= -f2)
          mkdir -p releases
          cp "$WS/$LOADER/build/libs/remnants_ballistics-$LOADER-${{ matrix.game }}-$VERSION.jar" releases/
          python3 scripts/verify_release_jars.py --version "$VERSION" --jar-dir releases --targets "$LOADER:${{ matrix.game }}" \
            --output "releases/manifest-$TARGET.json"
      - name: Record the results
        if: always()
        run: |
          mkdir -p releases
          echo "$TARGET: build ${{ steps.build.outcome }}, jar ${{ steps.verify.outcome }}, GameTests ${{ steps.gametest.outcome }}, client smoke test ${{ steps.smokereport.outcome }}" \
            > "releases/status-$TARGET.txt"
          cp smoketest/*.jpg smoketest/summary-*.txt releases/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.game }}-${{ matrix.loader }}
          if-no-files-found: ignore
          path: releases/
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: logs-${{ matrix.game }}-${{ matrix.loader }}
          if-no-files-found: ignore
          path: |
            *-output.log
            ${{ matrix.game }}/${{ matrix.loader }}/run/smoketest/logs/
            ${{ matrix.game }}/${{ matrix.loader }}/run/smoketest/crash-reports/

  # Collects every target's jar and screenshots into a pre-release: dev-build for main, dev-build-<branch> otherwise.
  publish-dev:
    needs: build
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: out
      - name: Publish the development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=dev-build
          if [ "$GITHUB_REF_NAME" != main ]; then TAG="dev-build-${GITHUB_REF_NAME//\//-}"; fi
          ls -la out
          STATUS=$(cat out/status-*.txt 2>/dev/null | sed 's/^/- /')
          SUMMARIES=$(cat out/summary-*.txt 2>/dev/null | sed 's/^/- /')
          if ls out/manifest-*.json > /dev/null 2>&1; then jq -s 'add' out/manifest-*.json > out/manifest.json; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Development build ${GITHUB_SHA::7} ($GITHUB_REF_NAME)" \
            --notes "Automatic build of \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7}. For testing only; use the tagged releases for servers.

          $STATUS

          Client smoke tests (the smoke-*.jpg files are screenshots from these runs):
          $SUMMARIES"
          if ls out/*.jar > /dev/null 2>&1; then gh release upload "$TAG" out/*.jar out/manifest.json --clobber; fi
          if ls out/*.jpg > /dev/null 2>&1; then gh release upload "$TAG" out/*.jpg --clobber; fi
