# Every field used by fabric.mod.json, mods.toml or a mixin config must also be in the expandProps map of
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.6.0
group=com.nightbeam.remnants
java_version=17

# Common
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
mod_name=Remnants: Ballistics
mod_author=NAIZO
mod_id=remnants_ballistics
license=Apache-2.0
description=A tactical firearms expansion: first-person gunplay, voxel weapon models, attachments, ammunition, crafting and server-authoritative multiplayer.

# Parchment adds readable parameter names in the dev environment. It requires access to
# maven.parchmentmc.org, so it is opt-in. Set use_parchment=true to enable it.
use_parchment=false
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14

# Forge (MinecraftForge; the jar also loads on NeoForge for 1.20.1, which still reports itself as "forge" 47.1)
forge_version=47.4.28
# Lowest Forge the jar declares support for in mods.toml.
forge_version_range=[47.1,)
forge_loader_version_range=[47,)

# Forge Config API Port: Forge's config API (ForgeConfigSpec) on Fabric, so both loaders share one config.
forgeconfigapiport_version=8.0.3

# Unit test dependencies (Maven Central)
junit_version=5.11.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
