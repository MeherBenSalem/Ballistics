name: Publisher checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.21.1/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.21.1/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          node --check scripts/release_metadata.mjs
          node --check scripts/upload_platforms.mjs
          node --check scripts/upload_platforms.test.mjs
      - name: Test metadata, offline preview and mocked upload transport
        run: node --test scripts/*.test.mjs

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check generated assets against the Java registries
        run: python tools/assets/check_assets.py
      - name: Reference docs are up to date
        run: |
          python tools/docs_gen.py
          git diff --exit-code -- docs/

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        game: ['1.21.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and run unit tests
        id: build
        run: |
          set -o pipefail
          chmod +x "${{ matrix.game }}/gradlew"
          cd "${{ matrix.game }}"
          ./gradlew build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 scripts/ci_annotate.py build-output.log "Build errors (${{ matrix.game }})"
      - name: Run GameTests on a headless NeoForge server
        id: gametest_neoforge
        run: |
          set -o pipefail
          cd "${{ matrix.game }}"
          ./gradlew :neoforge:runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-neoforge.log"
      - name: Run GameTests on a headless Fabric server
        id: gametest_fabric
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          cd "${{ matrix.game }}"
          ./gradlew :fabric:runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-fabric.log"
      - name: Report GameTest results
        if: always() && steps.build.outcome == 'success'
        run: |
          for loader in neoforge fabric; do
            log="gametest-$loader.log"
            if [ ! -f "$log" ]; then continue; fi
            grep -hoE '(All [0-9]+ required tests passed|[0-9]+ required tests failed)[^"]*' "$log" \
              | head -1 | sed "s/^/::notice title=GameTests ($loader, ${{ matrix.game }})::/" || true
          done
          if [ "${{ steps.gametest_neoforge.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-neoforge.log "GameTest failures (neoforge, ${{ matrix.game }})"
          fi
          if [ "${{ steps.gametest_fabric.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-fabric.log "GameTest failures (fabric, ${{ matrix.game }})"
          fi
      - uses: actions/setup-python@v5
        if: always() && steps.build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install a virtual display and software OpenGL
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install --quiet pillow
      - name: Boot the NeoForge client and exercise every weapon
        id: smoketest_neoforge
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.game }}/neoforge/run/smoketest"
          cp scripts/smoketest-options.txt "${{ matrix.game }}/neoforge/run/smoketest/options.txt"
          cd "${{ matrix.game }}"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge:runClientSmokeTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-neoforge.log"
      - name: Report the NeoForge client smoke test
        id: smokereport_neoforge
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-neoforge.log --run-dir "${{ matrix.game }}/neoforge/run/smoketest" --out smoketest --label NeoForge
      - name: Boot the Fabric client and exercise every weapon
        id: smoketest_fabric
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.game }}/fabric/run/smoketest"
          cp scripts/smoketest-options.txt "${{ matrix.game }}/fabric/run/smoketest/options.txt"
          cd "${{ matrix.game }}"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientSmokeTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-fabric.log"
      - name: Report the Fabric client smoke test
        id: smokereport_fabric
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-fabric.log --run-dir "${{ matrix.game }}/fabric/run/smoketest" --out smoketest --label Fabric
      - name: Verify the packaged jars
        id: verify
        if: always() && steps.build.outcome == 'success'
        run: |
          VERSION=$(grep '^version=' "${{ matrix.game }}/gradle.properties" | cut -d= -f2)
          mkdir -p releases
          for loader in neoforge fabric; do
            cp "${{ matrix.game }}/$loader/build/libs/remnants_ballistics-$loader-${{ matrix.game }}-$VERSION.jar" releases/
          done
          python3 scripts/verify_release_jars.py --version "$VERSION" --jar-dir releases --output releases/manifest.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: verified-${{ matrix.game }}
          path: |
            releases/*.jar
            releases/manifest.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: client-smoke-test-${{ matrix.game }}
          if-no-files-found: ignore
          path: |
            smoketest/
            smoketest-*.log
            ${{ matrix.game }}/*/run/smoketest/logs/
            ${{ matrix.game }}/*/run/smoketest/crash-reports/
      - name: Publish the development build
        if: always() && steps.verify.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GAMETESTS: neoforge ${{ steps.gametest_neoforge.outcome }}, fabric ${{ steps.gametest_fabric.outcome }}
          SMOKETESTS: neoforge ${{ steps.smokereport_neoforge.outcome }}, fabric ${{ steps.smokereport_fabric.outcome }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          NEOFORGE=$(cat smoketest/summary-neoforge.txt 2>/dev/null || echo "did not run")
          FABRIC=$(cat smoketest/summary-fabric.txt 2>/dev/null || echo "did not run")
          gh release create dev-build releases/*.jar releases/manifest.json --prerelease --target "$GITHUB_SHA" \
            --title "Development build ${GITHUB_SHA::7}" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7} (Fabric and NeoForge jars). Unit tests and jar verification passed; GameTests: ${GAMETESTS}; client smoke tests: ${SMOKETESTS}. NeoForge: ${NEOFORGE} Fabric: ${FABRIC} The smoke-*.jpg files are screenshots from those runs. For testing only; use the tagged releases for servers."
          if ls smoketest/*.jpg > /dev/null 2>&1; then gh release upload dev-build smoketest/*.jpg --clobber; fi
