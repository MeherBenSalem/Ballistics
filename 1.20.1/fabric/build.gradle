plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

// Development-only companion mod for the scripted client run: the shared script in common/src/smoketest plus the
// Fabric entry point and frame-capture mixin in src/smoketest. Never part of the release jar.
sourceSets {
    smoketest {
        java.srcDir project(':common').file('src/smoketest/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Forge's config system on Fabric; a required dependency for players too.
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        remnants_ballistics_smoketest {
            sourceSet sourceSets.smoketest
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
        // Headless GameTest server (fabric-gametest entry point); exits non-zero if a required test fails.
        gametest {
            server()
            setConfigName('Fabric GameTest')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/report.xml').get().asFile}"
            runDir('run/gametest')
            ideConfigGenerated(false)
        }
        // Scripted client run (CI runs it under Xvfb); see common/src/smoketest.
        clientSmokeTest {
            client()
            setConfigName('Fabric Client Smoke Test')
            source(sourceSets.smoketest)
            runDir('run/smoketest')
            programArgs '--width', '1280', '--height', '720', '--username', 'SmokeTest'
            ideConfigGenerated(false)
        }
    }
}
