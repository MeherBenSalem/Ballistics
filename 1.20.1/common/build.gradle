plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

// Loader-independent code compiles against vanilla Minecraft only (ModDevGradle Legacy's MCP mode). Anything
// loader-specific goes through com.nightbeam.remnants.ballistics.platform.Services, implemented in :fabric and :forge.
legacyForge {
    mcpVersion = minecraft_version
    // Vanilla members the common code needs (Fabric: remnants_ballistics.accesswidener).
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)
    if (project.use_parchment.toBoolean()) {
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // ForgeConfigSpec: built into Forge, provided on Fabric by Forge Config API Port.
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common:${forgeconfigapiport_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Pure-Java unit tests (com.nightbeam.remnants.ballistics.core) do not need the game.
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
