# Publish Remnants: Ballistics to Modrinth + CurseForge on version tags.
#
# Repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher metadata and transport
        run: node --test scripts/*.test.mjs

      - name: Cross-check generated assets
        run: python3 tools/assets/check_assets.py

      # 1.21.1 builds on Java 21; the 26.x workspaces need Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build 1.21.1
        run: |
          chmod +x 1.21.1/gradlew
          (cd 1.21.1 && ./gradlew build --no-daemon)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build 26.2 and 26.3
        run: |
          for game in 26.2 26.3; do
            chmod +x "$game/gradlew"
            (cd "$game" && ./gradlew build --no-daemon)
          done

      - name: Collect the release jars
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p releases
          for game in 1.21.1 26.2 26.3; do
            for loader in neoforge fabric; do
              cp "$game/$loader/build/libs/remnants_ballistics-$loader-$game-$VERSION.jar" releases/
            done
          done

      - name: Preview release metadata
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
        run: |
          python scripts/verify_release_jars.py --version "$VERSION" --jar-dir releases --output releases/manifest.json
          node scripts/upload_platforms.mjs --version "$VERSION" --jar-dir releases --require-all-targets --changelog-file "patchnotes/$VERSION.md" --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: releases/

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node scripts/upload_platforms.mjs --version "$VERSION" --jar-dir releases --require-all-targets --changelog-file "patchnotes/$VERSION.md"
