# Every field used by fabric.mod.json, neoforge.mods.toml or a mixin config must also be in the expandProps map of
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.5.0
group=com.nightbeam.remnants
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
mod_name=Remnants: Ballistics
mod_author=NAIZO
mod_id=remnants_ballistics
license=Apache-2.0
description=A tactical firearms expansion: first-person gunplay, voxel weapon models, attachments, ammunition, crafting and server-authoritative multiplayer.
# The vanilla toolchain the common project compiles against.
neo_form_version=1.21.1-20240808.144430

# Parchment adds readable parameter names in the dev environment. It requires access to
# maven.parchmentmc.org, so it is opt-in. Set use_parchment=true to enable it.
use_parchment=false
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.14

# NeoForge
neoforge_version=21.1.264
neoforge_loader_version_range=[1,)

# Forge Config API Port: the NeoForge config API (ModConfigSpec) on Fabric, so both loaders share one config.
forgeconfigapiport_version=21.1.6

# Unit test dependencies (Maven Central)
junit_version=5.11.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
