# Every field used by fabric.mod.json, neoforge.mods.toml or a mixin config must also be in the expandProps map of
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.5.0
group=com.nightbeam.remnants
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.3]
mod_name=Remnants: Ballistics
mod_author=NAIZO
mod_id=remnants_ballistics
license=Apache-2.0
description=A tactical firearms expansion: first-person gunplay, voxel weapon models, attachments, ammunition, crafting and server-authoritative multiplayer.
# The vanilla toolchain the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=26.3-1

# Fabric
fabric_version=0.165.0+26.3
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=26.3.0.99
neoforge_loader_version_range=[4,)

# Forge Config API Port: the NeoForge config API (ModConfigSpec) on Fabric, so both loaders share one config.
forgeconfigapiport_version=26.3.1

# Mixin and MixinExtras for the common project: both loaders bundle them at runtime.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.3

# Unit test dependencies (Maven Central)
junit_version=5.11.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
