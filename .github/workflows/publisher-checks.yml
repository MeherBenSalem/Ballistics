name: Publisher checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "docs/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          node --check scripts/release_metadata.mjs
          node --check scripts/upload_platforms.mjs
          node --check scripts/upload_platforms.test.mjs
      - name: Test metadata, offline preview and mocked upload transport
        run: node --test scripts/*.test.mjs

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check generated assets against the Java registries
        run: python tools/assets/check_assets.py
      - name: Ported resources (1.20.1, 26.x) are up to date with the 1.21.1 sources
        run: |
          python tools/assets/port_resources.py
          git status --porcelain -- 1.20.1 26.2 26.3
          test -z "$(git status --porcelain -- 1.20.1 26.2 26.3)"
      - name: Reference docs are up to date
        run: |
          python tools/docs_gen.py
          git diff --exit-code -- docs/

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # modloader: the non-Fabric loader project of the workspace (Forge on 1.20.1, NeoForge from 1.21.1).
        include:
          - game: '1.20.1'
            # Gradle and Loom run on 21; the workspace toolchain (compile, game runs) is 17.
            java: |
              17
              21
            modloader: forge
            modloader_label: Forge
          - game: '1.21.1'
            java: '21'
            modloader: neoforge
            modloader_label: NeoForge
          - game: '26.2'
            java: '25'
            modloader: neoforge
            modloader_label: NeoForge
          - game: '26.3'
            java: '25'
            modloader: neoforge
            modloader_label: NeoForge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and run unit tests
        id: build
        run: |
          set -o pipefail
          chmod +x "${{ matrix.game }}/gradlew"
          cd "${{ matrix.game }}"
          ./gradlew build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 scripts/ci_annotate.py build-output.log "Build errors (${{ matrix.game }})"
      - name: Run GameTests on a headless ${{ matrix.modloader_label }} server
        id: gametest_loader
        run: |
          set -o pipefail
          cd "${{ matrix.game }}"
          ./gradlew :${{ matrix.modloader }}:runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-${{ matrix.modloader }}.log"
      - name: Run GameTests on a headless Fabric server
        id: gametest_fabric
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          cd "${{ matrix.game }}"
          ./gradlew :fabric:runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gametest-fabric.log"
      - name: Report GameTest results
        if: always() && steps.build.outcome == 'success'
        run: |
          for loader in ${{ matrix.modloader }} fabric; do
            log="gametest-$loader.log"
            if [ ! -f "$log" ]; then continue; fi
            grep -hoE '(All [0-9]+ required tests passed|[0-9]+ required tests failed)[^"]*' "$log" \
              | head -1 | sed "s/^/::notice title=GameTests ($loader, ${{ matrix.game }})::/" || true
          done
          if [ "${{ steps.gametest_loader.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-${{ matrix.modloader }}.log "GameTest failures (${{ matrix.modloader }}, ${{ matrix.game }})"
          fi
          if [ "${{ steps.gametest_fabric.outcome }}" = failure ]; then
            python3 scripts/ci_annotate.py gametest-fabric.log "GameTest failures (fabric, ${{ matrix.game }})"
          fi
      - uses: actions/setup-python@v5
        if: always() && steps.build.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Install a virtual display and software OpenGL
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 > /dev/null
          pip install --quiet pillow
      - name: Boot the ${{ matrix.modloader_label }} client and exercise every weapon
        id: smoketest_loader
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          # 26.3 opens its window with SDL3, which asks for an sRGB-capable framebuffer; Xvfb's GLX visuals have none,
          # so go through EGL. GLFW (1.21.1, 26.2) ignores it.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.game }}/${{ matrix.modloader }}/run/smoketest"
          cp scripts/smoketest-options.txt "${{ matrix.game }}/${{ matrix.modloader }}/run/smoketest/options.txt"
          cd "${{ matrix.game }}"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.modloader }}:runClientSmokeTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-${{ matrix.modloader }}.log"
      - name: Report the ${{ matrix.modloader_label }} client smoke test
        id: smokereport_loader
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-${{ matrix.modloader }}.log --run-dir "${{ matrix.game }}/${{ matrix.modloader }}/run/smoketest" --out smoketest --label ${{ matrix.modloader_label }} --game "${{ matrix.game }}"
      - name: Boot the Fabric client and exercise every weapon
        id: smoketest_fabric
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          # 26.3 opens its window with SDL3, which asks for an sRGB-capable framebuffer; Xvfb's GLX visuals have none,
          # so go through EGL. GLFW (1.21.1, 26.2) ignores it.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.game }}/fabric/run/smoketest"
          cp scripts/smoketest-options.txt "${{ matrix.game }}/fabric/run/smoketest/options.txt"
          cd "${{ matrix.game }}"
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientSmokeTest --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/smoketest-fabric.log"
      - name: Report the Fabric client smoke test
        id: smokereport_fabric
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/smoketest_report.py --log smoketest-fabric.log --run-dir "${{ matrix.game }}/fabric/run/smoketest" --out smoketest --label Fabric --game "${{ matrix.game }}"
      - name: Verify the packaged jars
        id: verify
        if: always() && steps.build.outcome == 'success'
        run: |
          VERSION=$(grep '^version=' "${{ matrix.game }}/gradle.properties" | cut -d= -f2)
          mkdir -p releases
          for loader in ${{ matrix.modloader }} fabric; do
            cp "${{ matrix.game }}/$loader/build/libs/remnants_ballistics-$loader-${{ matrix.game }}-$VERSION.jar" releases/
          done
          python3 scripts/verify_release_jars.py --version "$VERSION" --game "${{ matrix.game }}" --jar-dir releases --output "releases/manifest-${{ matrix.game }}.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: verified-${{ matrix.game }}
          path: |
            releases/*.jar
            releases/manifest-*.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: client-smoke-test-${{ matrix.game }}
          if-no-files-found: ignore
          path: |
            smoketest/
            smoketest-*.log
            ${{ matrix.game }}/*/run/smoketest/logs/
            ${{ matrix.game }}/*/run/smoketest/crash-reports/
      - name: Record the results for the development build
        if: always() && steps.verify.outcome == 'success'
        env:
          GAMETESTS: ${{ matrix.modloader }} ${{ steps.gametest_loader.outcome }}, fabric ${{ steps.gametest_fabric.outcome }}
          SMOKETESTS: ${{ matrix.modloader }} ${{ steps.smokereport_loader.outcome }}, fabric ${{ steps.smokereport_fabric.outcome }}
        run: |
          mkdir -p smoketest
          LOADER=$(cat "smoketest/summary-${{ matrix.game }}-${{ matrix.modloader }}.txt" 2>/dev/null || echo "did not run")
          FABRIC=$(cat "smoketest/summary-${{ matrix.game }}-fabric.txt" 2>/dev/null || echo "did not run")
          echo "- ${{ matrix.game }}: GameTests ${GAMETESTS}; client smoke tests ${SMOKETESTS}. ${{ matrix.modloader_label }}: ${LOADER} Fabric: ${FABRIC}" \
            > "smoketest/result-${{ matrix.game }}.md"
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: dev-build-${{ matrix.game }}
          path: |
            releases/*.jar
            releases/manifest-*.json
            smoketest/*.jpg
            smoketest/result-*.md

  # One prerelease with the jars of every workspace that built and verified; the notes list each one's test results.
  dev-build:
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-build-*
          path: dev-build
          merge-multiple: true
      - name: Publish the development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA::7} (Fabric jars plus Forge (1.20.1) or NeoForge (1.21.1, 26.x) jars for every supported Minecraft version). Unit tests and jar verification passed."
            echo
            cat dev-build/smoketest/result-*.md
            echo
            echo "The smoke-*.jpg files are screenshots from the client smoke tests. For testing only; use the tagged releases for servers."
          } > notes.md
          gh release create dev-build dev-build/releases/*.jar dev-build/releases/manifest-*.json --prerelease --target "$GITHUB_SHA" \
            --title "Development build ${GITHUB_SHA::7}" --notes-file notes.md
          if ls dev-build/smoketest/*.jpg > /dev/null 2>&1; then gh release upload dev-build dev-build/smoketest/*.jpg --clobber; fi
