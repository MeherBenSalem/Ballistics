plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

// Development-only companion mod for the scripted client run (shared ClientSmokeTest in ../smoketest plus the Forge
// entry point in src/smoketest). Never part of the release jar.
sourceSets {
    smoketest {
        java.srcDir(rootProject.file('smoketest/java'))
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Forge 1.20.1 runs on SRG names: the jar task's output is reobfuscated (build/libs), the Mojang-named jar goes to
// build/devlibs.
legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)

    if (project.use_parchment.toBoolean()) {
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        remnants_ballistics_smoketest {
            sourceSet(sourceSets.smoketest)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            logLevel = org.slf4j.event.Level.INFO
            // Only the scripted client run loads the smoke-test companion mod.
            loadedMods = [mods.getByName(mod_id)]
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }

        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // A second client for local multiplayer testing (log in to a dedicated `server` run).
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Boots a GameTestServer, runs every gametest in our namespace and exits (non-zero on failure).
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Scripted client run (CI runs it under Xvfb): boots a world, exercises every weapon and screen, takes
        // screenshots into run/smoketest/screenshots, writes run/smoketest/smoketest/result.json and exits.
        clientSmokeTest {
            client()
            sourceSet = sourceSets.smoketest
            loadedMods = [mods.getByName(mod_id), mods.getByName('remnants_ballistics_smoketest')]
            gameDirectory = project.file('run/smoketest')
            programArguments.addAll '--width', '1280', '--height', '720', '--username', 'SmokeTest'
            disableIdeRun()
        }
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.smoketest)

// The one Forge mixin (aim sensitivity; Forge 1.20.1 has no event for it). The annotation processor writes the refmap
// that maps its targets to SRG names for production.
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.forge.mixins.json"
}

jar {
    manifest.attributes(['MixinConfigs': "${mod_id}.forge.mixins.json"])
}
